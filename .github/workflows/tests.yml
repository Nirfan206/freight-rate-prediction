name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Basic import checks
        env:
          PYTHONPATH: src
        run: |
          python -c "import data_cleaning, features, ridge_tuning"
          python -c "import production.config, production.model_registry, production.predictor, production.drift, production.monitoring, production.performance, production.uncertainty, production.retraining, production.training"
          python -c "import api.main; print('api import ok')"
      - name: Unit + API tests
        run: pytest -q
      - name: Official assessment scorer still passes
        run: python score.py --predictions validation_predictions.csv --december-predictions outputs/predictions/december_predictions.csv
