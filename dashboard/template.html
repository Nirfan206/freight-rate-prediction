<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freight rate prediction: ML pipeline report</title>
<style>
:root{--bg:#F6F7F9;--s:#fff;--ink:#161B22;--mut:#5B6573;--ln:#E2E5EA;--pri:#2457D6;--ok:#17835A;--warn:#A76A0C;--bad:#B93A2E;--pt:#E8EEFC;--ot:#E3F4EC;--wt:#FBF1DC;--bt:#FBE6E3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1318;--s:#171C23;--ink:#E8ECF1;--mut:#98A2B0;--ln:#28303A;--pri:#7FA2FF;--ok:#4CC38A;--warn:#E3B04B;--bad:#F08A80;--pt:#1B2740;--ot:#13302366;--wt:#3A2E12aa;--bt:#3B1B18aa}}
:root[data-theme=dark]{--bg:#0F1318;--s:#171C23;--ink:#E8ECF1;--mut:#98A2B0;--ln:#28303A;--pri:#7FA2FF;--ok:#4CC38A;--warn:#E3B04B;--bad:#F08A80;--pt:#1B2740;--ot:#13302366;--wt:#3A2E12aa;--bt:#3B1B18aa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--ln);background:var(--s);overflow:auto}
nav b{display:block;padding:0 10px 14px;font-size:14px}nav small{display:block;color:var(--mut);font-weight:400}
nav a{display:block;padding:7px 10px;margin:1px 0;border-radius:6px;color:var(--mut);text-decoration:none}
nav a:hover{background:var(--bg);color:var(--ink)}nav a[aria-current=page]{background:var(--pt);color:var(--pri);font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
main{padding:28px clamp(16px,4vw,44px) 60px;max-width:1120px;width:100%}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}h2{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}h3{font-size:15px;margin:0 0 10px}p{margin:6px 0;max-width:72ch}
.sub{color:var(--mut);margin:0 0 14px}.crumb{color:var(--mut);font-size:13px;margin-bottom:6px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:10px;padding:16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.grid.w{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.grid .card{margin:0}
.kpi{background:var(--s);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}.kpi span{color:var(--mut);font-size:13px}.kpi b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi small{color:var(--mut)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pt);color:var(--pri);margin:0 6px 4px 0}
.badge.ok{background:var(--ot);color:var(--ok)}.badge.warn{background:var(--wt);color:var(--warn)}.badge.bad{background:var(--bt);color:var(--bad)}
.note{border-left:3px solid var(--pri);background:var(--pt);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}.note.warn{border-color:var(--warn);background:var(--wt)}.note.bad{border-color:var(--bad);background:var(--bt)}.note.ok{border-color:var(--ok);background:var(--ot)}
.empty{padding:22px;border:1px dashed var(--ln);border-radius:10px;color:var(--mut);text-align:center}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--ln)}th{color:var(--mut);font-weight:500}tr.hl td{background:var(--pt);font-weight:600}td.n,th.n{text-align:right}.tw{overflow-x:auto}
.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:minmax(90px,200px) 1fr 80px;gap:10px;align-items:center;font-size:13px}.bar i{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}.bar u{display:block;height:100%;background:var(--mut);opacity:.55;border-radius:6px}.bar.hl u{background:var(--pri);opacity:1}.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;gap:3px;align-items:flex-end;height:150px;padding-bottom:18px}.col{flex:1;height:100%;display:flex;align-items:flex-end;position:relative}.col u{display:block;width:100%;background:var(--pri);opacity:.75;border-radius:3px 3px 0 0}.col.b u{background:var(--warn)}.col span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut);white-space:nowrap}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mut);font-size:11px}
details{border:1px solid var(--ln);border-radius:10px;background:var(--s);margin:8px 0}summary{cursor:pointer;padding:11px 14px;font-weight:600}details>div{padding:0 14px 14px}
.chips span{display:inline-block;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:1px 6px;margin:2px}
.tl{display:flex;height:46px;border-radius:8px;overflow:hidden;border:1px solid var(--ln);margin:8px 0 4px}.tl div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap}
.tr{background:var(--pt);color:var(--pri)}.ho{background:var(--wt);color:var(--warn)}.as{background:var(--bg);color:var(--mut)}.dc{background:var(--ot);color:var(--ok)}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
input[type=search],button.b{font:inherit;padding:8px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--s);color:var(--ink)}input[type=search]{width:100%}
button.b{cursor:pointer;margin:2px}button.b[aria-pressed=true]{background:var(--pt);color:var(--pri);border-color:var(--pri)}
.pick{display:block;width:100%;text-align:left;margin:3px 0}pre{background:var(--bg);padding:12px;border-radius:8px;overflow:auto;font-size:12.5px}img.eda{width:100%;border:1px solid var(--ln);border-radius:8px;background:#fff}
.cl{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;align-items:center;gap:6px;text-align:center}.cl>div{padding:10px;border-radius:8px;background:var(--bg);border:1px solid var(--ln);font-size:13px}
@media(max-width:820px){body{display:block}nav{position:static;height:auto;border:0;border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:2px}nav b{width:100%;padding-bottom:6px}.bar{grid-template-columns:90px 1fr 64px}.cl{grid-template-columns:1fr}.cl>div:nth-child(even){display:none}}
</style></head><body>
<nav aria-label="Sections" id="nav"></nav><main id="main" tabindex="-1"></main>
<script>/*__DATA__*/</script>
<script>
const $=s=>document.querySelector(s),f0=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString(),f2=n=>n==null?'—':Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),usd=n=>n==null?'—':'$'+f2(n),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),K=D.k,
empty=m=>`<div class=empty><b>Nothing to show</b><p>${m} Run the pipeline step that creates it, then rebuild the dashboard.</p></div>`,
card=(t,b,c='')=>`<section class="card ${c}">${t?`<h3>${t}</h3>`:''}${b}</section>`,
kpi=(l,v,s,t)=>`<div class=kpi title="${esc(t||'')}"><span>${l}</span><b>${v}</b><small>${s||''}</small></div>`,
badge=(t,k='')=>`<span class="badge ${k}">${t}</span>`,note=(t,k='')=>`<div class="note ${k}">${t}</div>`,
head=(t,s,c)=>`<div class=crumb>Report / ${c}</div><h1>${t}</h1><p class=sub>${s}</p>`,
table=(h,rows,hl=-1)=>`<div class=tw><table><thead><tr>${h.map((x,i)=>`<th class="${i?'n':''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===hl?'hl':''}">${r.map((c,j)=>`<td class="${j?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function bars(rows,{fmt=f0,hl=-1}={}){const m=Math.max(...rows.map(r=>r.v));return`<div class=bars>${rows.map((r,i)=>`<div class="bar ${i===hl?'hl':''}" title="${esc(r.l)}: ${fmt(r.v)}"><span>${esc(r.l)}</span><i><u style="width:${Math.max(1,r.v/m*100)}%"></u></i><em>${fmt(r.v)}</em></div>`).join('')}</div>`}
function cols(v,l,{fmt=f0,cls=[],t=l}={}){const m=Math.max(...v);return`<div class=cols role=img aria-label="Column chart">${v.map((x,i)=>`<div class="col ${cls[i]||''}" title="${esc(t[i])}: ${fmt(x)}"><u style="height:${Math.max(1,x/m*100)}%"></u><span>${esc(l[i])}</span></div>`).join('')}</div>`}
function line(y,xl,{fmt=f0,hl=-1,w=680,h=230}={}){const p=52,mn=Math.min(...y),mx=Math.max(...y),pad=(mx-mn||1)*.15,lo=mn-pad,hi=mx+pad,X=i=>p+i*(w-p-10)/Math.max(1,y.length-1),Y=v=>h-26-(v-lo)/(hi-lo)*(h-44),st=Math.ceil(y.length/10);
return`<svg viewBox="0 0 ${w} ${h}" role=img aria-label="Line chart">${[0,1,2,3].map(i=>{const v=lo+(hi-lo)*i/3;return`<line x1=${p} x2=${w-10} y1=${Y(v)} y2=${Y(v)} stroke="var(--ln)"/><text x=${p-6} y=${Y(v)+4} text-anchor=end>${fmt(v)}</text>`}).join('')}<polyline fill=none stroke="var(--pri)" stroke-width=2 points="${y.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${y.map((v,i)=>`<circle cx=${X(i)} cy=${Y(v)} r=${i===hl?6:3} fill="${i===hl?'var(--ok)':'var(--pri)'}"><title>${esc(xl[i])}: ${fmt(v)}</title></circle>${i%st===0||i===hl?`<text x=${X(i)} y=${h-8} text-anchor=middle>${esc(xl[i])}</text>`:''}`).join('')}</svg>`}
const ord=(rows,key,o)=>o.map(k=>rows.find(r=>String(r[key])===k)).filter(Boolean),pct=(a,b)=>(a/b*100).toFixed(1)+'%';
const P=D.prof,newc=D.newc,dec=D.dec.rows,decv=dec.map(r=>r.predicted_rate),bestM=D.models[0];
const stages=[
['Data','Reads 48,000 labeled loads (Jan–Oct 2025) and 12,000 unlabeled assessment loads (Nov–Dec 2025).','Everything downstream depends on which rows have a known rate.',`${f0(K.dev)} development rows, ${f0(K.assess)} assessment rows, ${K.raw_cols} raw columns.`],
['Quality checks','Counts missing, invalid and duplicate values before any change.','You cannot trust a model trained on data nobody checked.',`${P.train.dup} duplicate rows, ${P.train.bad_dist} non-positive distances, ${P.train.miss_w} missing weights, ${P.train.neg_w} negative weights, ${P.train.miss_mi} missing market index values.`],
['Cleaning','Fills gaps using only training-period statistics and keeps flags that mark repaired rows. The target is never altered.','Fitting fills on training data only stops future information leaking into the model.','Median weight fill, date-aware market index fill, 0/1 quality flags. No rows deleted.'],
['Feature engineering','Turns raw columns into model inputs: time, distance, weight, geography, market, equipment.','Gives a simple model the shape of freight pricing (log distance, interactions).',`${K.feats} model features in ${D.groups.length} groups.`],
['Model experiments','Compares simple baselines, tree models and Ridge on the same holdout.','Shows whether added complexity earns its keep.',`${D.models.length} result rows; lowest MAE: ${esc(bestM.model)} at ${usd(bestM.MAE)}.`],
['Temporal validation','Trains on Jan–Aug and tests on Sep–Oct, in time order.','Mimics real use: predict the future from the past.',`${f0(K.pre)} training rows, ${f0(K.holdout)} holdout rows.`],
['Final model','Ridge regression, alpha 0.01, on log1p(rate), retrained on all 48,000 labeled rows.','The model that produced every submitted prediction.',`Holdout MAE ${usd(K.mae)}, RMSE ${usd(K.rmse)}, R² ${K.r2.toFixed(4)}, MAPE ${K.mape.toFixed(2)}%.`],
['Predictions','Scores the 12,000 assessment loads and the 31 fixed December loads with the saved model.','These files are what gets submitted.',`${f0(K.assess)} validation predictions, 31 December predictions.`],
['Scorer','Official score.py checks file format, IDs, positivity and December inputs, and draws the chart.','Catches format mistakes before submission. It does not measure accuracy.',D.scorer.code===0?'Passed (exit code 0).':'Failed. See Submission page.']];
const pages={
overview(){const ok=D.scorer.code===0;return head('Spotter freight rate prediction','Machine learning pipeline for freight rate estimation',"Overview")+
`<div>${badge('Model: artifact present '+(D.tech.tree.artifacts?.includes('ridge_model.joblib')?'':'(missing)'),D.tech.tree.artifacts?.includes('ridge_model.joblib')?'ok':'bad')}${badge('Prediction files: format verified',D.checks.every(c=>c.status==='pass')?'ok':'warn')}${badge('Official scorer: '+(ok?'passed':'failed'),ok?'ok':'bad')}</div>
<h2>Model quality on the Sep–Oct holdout</h2><p class=sub>Labeled loads held back in time. These are the only accuracy numbers in the repository.</p>
<div class=grid>${kpi('Development rows',f0(K.dev),'Jan–Oct 2025, labeled')}${kpi('Holdout rows',f0(K.holdout),'Sep–Oct 2025, labeled')}${kpi('Assessment rows',f0(K.assess),'Nov–Dec 2025, no labels')}${kpi('Model features',K.feats,'after engineering')}${kpi('MAE',usd(K.mae),'average dollar error','Mean absolute error. Lower is better.')}${kpi('RMSE',usd(K.rmse),'penalises big misses','Root mean squared error.')}${kpi('R²',K.r2.toFixed(4),'share of variation explained')}${kpi('MAPE',K.mape.toFixed(2)+'%','average percentage error','Mean absolute percentage error.')}</div>
${note(`<b>Read this first.</b> The metrics above come from the Sep–Oct holdout inside the development data. The 12,000-row assessment set has no labels, so its accuracy is unknown here; Spotter calculates it after submission. That set also contains ${newc.cities.length} cities never seen in training (${f0(newc.rows)} rows, ${newc.pct.toFixed(1)}%), and the holdout contained none, so generalisation to new cities is untested.`,'warn')}
<h2>ML pipeline</h2><p class=sub>Open any stage for what it does, why it matters and what it produced.</p>
${stages.map((s,i)=>`<details ${i===0?'open':''}><summary>${i+1}. ${s[0]}</summary><div><p><b>What it does.</b> ${s[1]}</p><p><b>Why it matters.</b> ${s[2]}</p><p><b>Result.</b> ${s[3]}</p></div></details>`).join('')}`},
data(){const T=P.train,V=P.val,h=D.hist,mi=D.mi,c=Object.fromEntries(D.clean.map(r=>[r.issue,r]));
return head('Data and quality','What went in, what was wrong with it, and what was done about it.','Data')+
`<div class=grid>${kpi('Development set',f0(T.rows),`${T.start} to ${T.end}`)}${kpi('Assessment set',f0(V.rows),`${V.start} to ${V.end}`)}${kpi('December scenario','31 rows','one fixed route, one row per day')}${kpi('Cities',T.cities,'pickup cities in development data')}</div>
<div class="grid w"><section class=card><h3>Posted rate (target) distribution</h3>${cols(h.counts,h.edges.slice(0,-1).map((e,i)=>i%5===0?'$'+f0(e):''),{t:h.edges.slice(0,-1).map((e,i)=>`$${f0(e)}–$${f0(h.edges[i+1])}`)})}<p class=sub>Shows rates up to the 99th percentile ($${f0(h.q99)}); ${f0(h.over)} higher rows are not drawn.</p></section>
<section class=card><h3>Missing values (% of rows)</h3>${bars([{l:'Weight, development',v:T.miss_w/T.rows*100},{l:'Weight, assessment',v:V.miss_w/V.rows*100},{l:'Market index, development',v:T.miss_mi/T.rows*100},{l:'Market index, assessment',v:V.miss_mi/V.rows*100}],{fmt:x=>x.toFixed(2)+'%'})}<p class=sub>All other columns have none. The December input has no market index or quote signal at all.</p></section></div>
<section class=card><h3>Market index by month: development vs assessment</h3>${cols(mi.vals,mi.labels.map(l=>l.slice(2)),{fmt:x=>x.toFixed(3),cls:mi.split.map(s=>s==='assessment'?'b':'')})}<p class=sub>Blue: development months. Amber: assessment months (Nov–Dec). The index moves seasonally, and the assessment months sit near the low end of what training saw (Nov–Dec mean ${D.dec.mi_nd.toFixed(3)} vs development mean ${D.dec.mi_train.toFixed(3)}).</p></section>
<h2>Data quality findings</h2>
${table(['Issue','Impact','Treatment'],[
[`Missing weight: ${f0(T.miss_w)} rows`,'Weight feeds several features; blanks would break the model.','Training-median fill plus a missing-weight flag.'],
[`Negative weight: ${f0(T.neg_w)} rows`,'A negative weight is physically impossible.','Kept as-is, flagged, and handled by an absolute-weight feature; clipped to 0 inside log weight.'],
[`Weight at ±47,500 lb cap: ${f0(T.cap)} rows`,'Looks like a recording limit, not a real weight.','Flagged with positive-cap and negative-cap indicators.'],
[`Missing market index: ${f0(T.miss_mi)} rows`,'The index is a main market signal.','Training-period mean for that date, else overall median, plus a missing flag.'],
['Target outliers',`Highest rate $${f0(D.hist.q99)}+ in the top 1%; maximum far above the median.`,'No rows removed; the model learns on log1p(rate), which dampens their pull.'],
[`Duplicates: ${T.dup} rows, ${T.dup_id} repeated IDs; invalid distances: ${T.bad_dist}`,'None found.','The cleaning code stops with an error if a non-positive distance appears.']])}
<h2>Before and after</h2><div class=grid w style="display:grid;gap:12px">${[['Missing weight',c.missing_weight],['Missing market index',c.missing_market_index]].map(([n,r])=>r?card(n,`<div class=cl><div>Before<br><b>${f0(r.original_count)}</b></div><span>→</span><div>${esc(r.action)}</div><span>→</span><div>After<br><b>${f0(r.cleaned_count)}</b> missing</div></div>`):'').join('')}${c.negative_weight?card('Negative weight',`<div class=cl><div>Before<br><b>${f0(c.negative_weight.original_count)}</b></div><span>→</span><div>${esc(c.negative_weight.action)}</div><span>→</span><div>After<br><b>${f0(c.negative_weight.cleaned_count)}</b> flagged</div></div>`):''}</div>${D.clean.length?'':empty('cleaning_diagnostic.csv is missing.')}`},
features(){return head('Feature engineering',`${K.feats} model inputs in ${D.groups.length} groups. All are computable at prediction time; none uses the target.`,'Features')+
D.groups.map(g=>card(`${g.name} <span class=sub>(${g.features.length})</span>`,`<p>${esc(g.how)}</p><div class=chips>${g.features.map(f=>`<span>${esc(f)}</span>`).join('')}</div>`)).join('')+
`<details><summary>Technical details</summary><div><p>Pipeline: cleaning statistics are fitted on the training window only, then <code>build_features</code> creates base features, one-hot equipment and equipment interactions. <code>get_model_features</code> keeps numeric columns and excludes load_id, posted_rate, rate_per_mile, city names, equipment text and raw date. City coordinates stay so unseen cities can still be placed. Model steps: median imputer, standard scaler, Ridge. The saved artifact bundles the model, feature order and cleaning statistics.</p></div></details>`},
models(){const t=D.tune,bi=t.reduce((a,r,i)=>r.MAE<t[a].MAE?i:a,0),tt=[...t].sort((a,b)=>a.alpha-b.alpha),bt=tt.findIndex(r=>r.alpha===K.alpha);
return head('Model lab','Every model scored on the same Sep–Oct holdout. Lower MAE (average dollar error) is better.','Models')+
card('MAE by model',bars(D.models.map(m=>({l:m.model,v:m.MAE})),{fmt:usd,hl:D.models.findIndex(m=>m.final)}))+
card('Full comparison',table(['Model','MAE','RMSE','R²','Source file'],D.models.map(m=>[esc(m.model),usd(m.MAE),usd(m.RMSE),m.R2.toFixed(4),`<small>${esc(m.src)}</small>`]),D.models.findIndex(m=>m.final)))+
note('Tree models appear in two result files with different settings, so both are shown and labelled. Rows from different source files were run by different scripts on the same split.')+
card('Why this model?',`<p>The final model has the lowest MAE of every row above (${D.models[0].final?'verified from the files':'check: not the lowest in these files'}): ${usd(K.mae)} vs ${usd(D.models[1].MAE)} for the next best. On RMSE the top models are close (${usd(K.rmse)} vs ${usd(D.models[1].RMSE)}), so the advantage is mostly in typical errors, not in the largest misses.</p><p><b>Setup.</b> Ridge regression, alpha ${K.alpha}, trained on log1p(posted rate) and converted back with expm1; ${K.feats} features; retrained on all ${f0(K.dev)} labeled rows; checked with a chronological holdout.</p>${note('The model type and alpha were both chosen on the same Sep–Oct holdout that is reported, so the reported figures are slightly optimistic. No separate untouched test split exists.','warn')}`)+
`<h2>Ridge tuning</h2>`+card('MAE by alpha',line(tt.map(r=>r.MAE),tt.map(r=>'α '+r.alpha),{fmt:usd,hl:bt}))+
card('Results',table(['Alpha','MAE','RMSE','R²'],tt.map(r=>[r.alpha,usd(r.MAE),usd(r.RMSE),r.R2.toFixed(5)]),bt))+
`<div class="grid w"><section class=card><h3>Simple explanation</h3><p>Alpha is a dial for how strongly the model is stopped from over-reacting to noise. Higher alpha means a more cautious model.</p></section><section class=card><h3>Technical explanation</h3><p>Alpha is the L2 penalty on coefficients. Error rose steadily with alpha, and the best value (${K.alpha}) is the smallest tested, so lower values were not explored. The differences between 0.01 and 1 are tiny (${usd(tt[0].MAE)} to ${usd(tt[2].MAE)}).</p></section></div>`},
validation(){const a=K.pre,b=K.holdout;return head('Validation','Training on the past, testing on the future.','Validation')+
card('Timeline',`<div class=tl><div class=tr style="flex:8">Jan–Aug: train</div><div class=ho style="flex:2">Sep–Oct: holdout</div><div class=as style="flex:2">Nov–Dec: assessment</div></div><small class=sub>Experiments: train on Jan–Aug, test on Sep–Oct. Final model: retrained on all Jan–Oct data, then predicts the unlabeled Nov–Dec set.</small>`)+
`<div class=grid>${kpi('Training rows',f0(a),`${D.pre_dates.start} to ${D.pre_dates.end}`)}${kpi('Holdout rows',f0(b),`${K.ho_start} to ${K.ho_end}`)}${kpi('MAE',usd(K.mae))}${kpi('RMSE',usd(K.rmse))}${kpi('R²',K.r2.toFixed(4))}${kpi('MAPE',K.mape.toFixed(2)+'%')}</div>
${card('Why chronological?','<p>Shuffling rows would let the model see next week while predicting last week. Splitting by date forces it to predict forward, as it must for November and December. Cleaning statistics (median weight, market index fills) are learned from the training window only.</p>')}
${note(`<b>Gap between holdout and assessment.</b> ${newc.cities.length} cities in the assessment data (${esc(newc.cities.join(', '))}) never appear in training: ${f0(newc.rows)} rows (${newc.pct.toFixed(1)}%). The holdout had no such rows. The model uses coordinates so it can place new cities, but this has not been measured.`,'warn')}${card('Model comparison on the holdout',bars(D.models.map(m=>({l:m.model,v:m.MAE})),{fmt:usd,hl:D.models.findIndex(m=>m.final)}))}`},
predictions(){const R=D.pred.rows;if(!R.length)return head('Prediction explorer','','Predictions')+empty('validation_predictions.csv is missing.');
return head('Prediction explorer','Search the 12,000 assessment loads and see the model\'s estimate for each.','Predictions')+`<label for=q class=sub>Search by load ID or city</label><input id=q type=search placeholder="TE-000123 or Chicago" autocomplete=off><div id=res></div><div id=sel></div>`},
december(){if(!dec.length)return head('December scenario','','December')+empty('december_predictions.csv is missing.');const mn=Math.min(...decv),mx=Math.max(...decv),av=decv.reduce((a,b)=>a+b)/decv.length,d=D.dec,r0=dec[0];
return head('December scenario','Predicted rate for one fixed load on each day of December 2025.','December')+
`<div class=grid>${kpi('Minimum',usd(mn),dec[decv.indexOf(mn)].date)}${kpi('Maximum',usd(mx),dec[decv.indexOf(mx)].date)}${kpi('Average',usd(av))}${kpi('Spread',usd(mx-mn),pct(mx-mn,av)+' of average')}</div>`+card('Predicted rate by day',line(decv,dec.map(r=>r.date.slice(8)),{fmt:usd}))+
card('Scenario inputs',`<p>${esc(r0.pickup)} to ${esc(r0.delivery)}, ${f0(r0.distance)} miles, ${esc(r0.equipment)}, ${f0(r0.weight)} lb. Only the date changes, so every difference between days comes from the date features (day of week, day of month, day of year).</p>`)+
note(`<b>Assumption, not observed data.</b> The December input has no market index or quote signal. <code>predict_december.py</code> fills both with the overall development medians (market index ${d.mi_fallback.toFixed(4)}, quote signal ${d.qs_fallback.toFixed(4)}) before cleaning. Because they are filled first, the missing-market-index flag is 0 and the date-aware fill is never used. The assessment months' market index averages ${d.mi_nd.toFixed(3)}, and the index normally cycles weekly and seasonally, so a flat median is a simplification.`,'warn')+
`<details><summary>Date-by-date table</summary><div>${table(['Date','Predicted rate'],dec.map(r=>[r.date,usd(r.predicted_rate)]))}</div></details>`},
errors(){const E=D.err;if(!E.by_distance.length)return head('Error analysis','','Errors')+empty('Error analysis files are missing.');
const dist=ord(E.by_distance,'distance_bucket',['<=200','201-500','501-1000','1001-1500','1501-2000','>2000']),wt=ord(E.by_weight,'weight_bucket',['<=10k','10k-20k','20k-30k','30k-40k','>40k']),mo={9:'Sep',10:'Oct'},rel=r=>r.MAE/r.actual_mean*100;
return head('Error analysis',`Where the model is off, on the ${f0(K.holdout)}-row Sep–Oct holdout.`,'Errors')+
card('By distance: average dollar error (MAE)',bars(dist.map(r=>({l:r.distance_bucket+' mi',v:r.MAE})),{fmt:usd})+`<p class=sub>Dollar error grows with distance (${usd(dist[0].MAE)} to ${usd(dist.at(-1).MAE)}), but as a share of the average rate it stays between ${Math.min(...dist.map(rel)).toFixed(1)}% and ${Math.max(...dist.map(rel)).toFixed(1)}%, because long loads cost more.</p>`)+
`<div class="grid w">${card('By equipment (MAE)',bars(E.by_equipment.map(r=>({l:r.equipment,v:r.MAE})),{fmt:usd}))}${card('By weight (MAE)',bars(wt.map(r=>({l:r.weight_bucket+' lb',v:r.MAE})),{fmt:usd}))}${card('By month (MAE)',bars(E.by_month.map(r=>({l:mo[r.month]||r.month,v:r.MAE})),{fmt:usd}))}</div>`+
card('New cities',E.new_city.length&&E.new_city.every(r=>String(r.new_city)==='false')?note(`The holdout contained no unseen cities, so this analysis has only one group (${f0(E.new_city[0].rows)} rows, MAE ${usd(E.new_city[0].MAE)}). The assessment set has ${f0(newc.rows)} such rows, so behaviour there is unmeasured.`,'warn'):table(['New city','Rows','MAE'],E.new_city.map(r=>[r.new_city,f0(r.rows),usd(r.MAE)])))+
(()=>{const r=(a,k)=>{const v=a.map(x=>x.MAE);return usd(Math.min(...v))+' to '+usd(Math.max(...v))};return note(`<b>Findings.</b> MAE ranges ${r(E.by_equipment)} across equipment, ${r(wt)} across weight buckets and ${r(E.by_month)} across months. Distance is the only factor with a clear pattern in dollars; the weight and month differences are small and do not form a trend.`)})()},
production(){const P=D.prod||{},m=P.model,pr=P.predictions||{},dr=P.drift,pf=P.performance,rt=P.retraining||{},iv=m&&m.prediction_interval;
const st=s=>({stable:'ok',ok:'ok',warning:'warn',degraded:'bad',drift:'bad'}[s]||'');
const head0=head('Production ML','Deployable architecture and local production simulation. Separate from the assessment results.','Production')+
note('<b>Assessment results vs production monitoring.</b> Every other page reports the <b>offline assessment</b>. This page reports the <b>production layer</b> (API, registry, monitoring). It is a local simulation: <b>no public production deployment is claimed</b>, and nothing here is real-time unless the monitoring scripts have been run.','warn');
if(!P.registry||!m)return head0+note('No production model registry found ('+esc(P.error||'models/registry/production.json missing')+'). Run <code>python scripts/register_assessment_model.py --promote</code>.');
const mt=m.metrics||{};
const model=`<h2>Production monitoring: current model</h2><div class=grid>${kpi('Production model',esc(P.record.model_name),m.algorithm+', alpha '+m.alpha)}${kpi('Version',esc(P.record.production_version),'status: '+esc(P.record.status))}${kpi('Training rows',f0(m.training_rows),esc((m.training_data_period||{}).start)+' to '+esc((m.training_data_period||{}).end))}${kpi('Features',f0(m.feature_count),'target '+esc(m.target_transformation))}</div>
<div class=grid>${kpi('MAE',usd(mt.MAE),'temporal holdout')}${kpi('RMSE',usd(mt.RMSE),'temporal holdout')}${kpi('R²',mt.R2==null?'—':mt.R2.toFixed(4),'temporal holdout')}${kpi('MAPE',mt.MAPE_percent==null?'—':mt.MAPE_percent.toFixed(2)+'%','temporal holdout')}</div><p class=sub>These four numbers are the <b>Sep–Oct 2025 holdout</b> metrics stored in the model metadata. They are not live production accuracy.</p>`;
const vers=card('Model registry versions',table(['Version','Algorithm','Alpha','Trained','MAE','Status'],P.versions.map(v=>[esc(v.version),esc(v.algorithm||'—'),esc(v.alpha),esc((v.training_date||'—').slice(0,10)),usd(v.MAE),v.is_production?badge('production','ok'):badge(v.complete?'registered':'incomplete',v.complete?'':'bad')])).replace(/<td class="n">/g,'<td>')+`<p class=sub>History: ${P.history.map(h=>esc(h.action)+' → '+esc(h.to)).join(', ')||'none'}. Versions are never deleted; promotion and rollback only rewrite production.json.</p>`);
const pred=pr.available?card('Prediction monitoring (prediction log)',`<div class=grid>${kpi('Predictions',f0(pr.n_predictions),'errors: '+f0(pr.error_count))}${kpi('Average prediction',usd(pr.mean_prediction),'median '+usd(pr.median_prediction))}${kpi('Average latency',pr.avg_latency_ms==null?'—':f2(pr.avg_latency_ms)+' ms','p95 '+(pr.p95_latency_ms==null?'—':f2(pr.p95_latency_ms)+' ms'))}</div><p class=sub>Log span ${esc(pr.first_timestamp||'—')} to ${esc(pr.last_timestamp||'—')}.</p>`):card('Prediction monitoring',note('No production prediction data available.'));
const drift=dr?card('Data drift (PSI)',`<p>${badge(esc(dr.overall_status),st(dr.overall_status))} <span class=sub>source: <b>${esc(dr.source||'unknown')}</b>, ${f0(dr.n_current_rows)} rows, generated ${esc((dr.generated_at||'').slice(0,19))}</span></p>`+table(['Feature','Metric','Value','Status'],dr.features.map(f=>[esc(f.feature),esc(f.metric),f.value==null?'—':f.value.toFixed(4),badge(esc(f.status),st(f.status))])).replace(/<td class="n">/g,'<td>')+`<p class=sub>Thresholds: PSI &lt; 0.10 stable, 0.10–0.25 warning, &gt; 0.25 drift. ${/^csv:/.test(dr.source||'')?'<b>This report compares a CSV file with the training data; it is not production traffic.</b>':''}</p>`):card('Data drift',note('No drift report yet. Run <code>python scripts/detect_drift.py</code>.'));
const perf=pf&&pf.available?card('Model performance monitoring',`<div class=grid>${kpi('Live MAE',usd(pf.overall.MAE),'n='+f0(pf.overall.n))}${kpi('RMSE',usd(pf.overall.RMSE))}${kpi('Bias',usd(pf.overall.bias_mean_error),'predicted − actual')}${kpi('vs baseline',pf.baseline_comparison&&pf.baseline_comparison.mae_change_percent!=null?pf.baseline_comparison.mae_change_percent.toFixed(1)+'%':'—',esc((pf.baseline_comparison||{}).status||''))}</div>`):card('Model performance monitoring',note('Performance monitoring waiting for actual target values.'));
const lt=rt.last_training,lc=rt.last_check;
const retr=card('Retraining status',`<ul>${lt?`<li>Last registered training run: <b>${esc(lt.version)}</b> (alpha ${esc(lt.alpha)}, holdout MAE ${usd(lt.MAE)}), promoted: ${lt.promoted?'yes':'<b>no, awaiting explicit promotion</b>'}.</li>`:'<li>No retraining run recorded by train_production.py.</li>'}${lc?`<li>Last policy check: retraining ${lc.recommended?'<b>recommended</b> ('+esc(lc.reasons.join('; '))+')':'not recommended'}.</li>`:'<li>No retraining policy check recorded.</li>'}</ul><p class=sub>Retraining is explicit (scripts/train_production.py); models are never auto-promoted.</p>`);
const status=card('Monitoring status',table(['Component','State'],[['Prediction log',pr.available?badge('active','ok'):badge('no data','warn')],['Drift report',dr?badge(esc(dr.overall_status),st(dr.overall_status)):badge('not run','warn')],['Performance monitoring',pf&&pf.available?badge('active','ok'):badge('waiting for actuals','warn')],['Retraining history',lt?badge('recorded','ok'):badge('none','warn')]]).replace(/<td class="n">/g,'<td>'));
const unc=iv?card('Prediction intervals (API only)',`<p>Nominal ${(iv.nominal_coverage*100).toFixed(0)}% empirical residual-based interval. ${iv.holdout_check?`Checked out-of-sample on ${esc(iv.holdout_check.evaluated_on)}: <b>${(iv.holdout_check.empirical_coverage*100).toFixed(1)}%</b> actually covered.`:''}</p><p class=sub>${esc(iv.disclaimer)} The official assessment predictions have no interval.</p>`):'';
return head0+model+vers+`<h2>Production monitoring</h2>`+status+pred+drift+perf+retr+unc},
eda(){const cats=[...new Set(D.eda.map(e=>e.cat))];return head('EDA gallery','Pick a category, then a chart.','EDA')+`<div id=cats>${cats.map((c,i)=>`<button class=b data-c="${esc(c)}" aria-pressed=${i===0}>${esc(c)}</button>`).join('')}</div><div id=ch></div><div id=view></div>`},
submission(){const ok=D.scorer.code===0,T=D.tech;return head('Submission readiness','What was verified from the files, and what was not.','Submission')+
card('Checklist',table(['Check','Status','Detail'],D.checks.map(c=>[esc(c.name),badge(c.status==='pass'?'Pass':'Fail',c.status==='pass'?'ok':'bad'),esc(c.detail)])).replace(/<td class="n">/g,'<td>'))+
card('File validation: official scorer',`${badge(ok?'Passed':'Failed',ok?'ok':'bad')}<pre>${esc(D.scorer.out)}</pre><p class=sub>Run by the dashboard builder into a temporary folder.</p>`)+
note('<b>File validation is not accuracy.</b> The scorer checks format, IDs, positive values and December inputs. Final validation metrics are calculated by Spotter after submission, so no assessment-set accuracy is shown anywhere in this report.')+
`<h2>Limitations and audit notes</h2>`+card('',`<ul><li>${newc.cities.length} assessment cities are unseen in training (${f0(newc.rows)} rows); the holdout had none.</li><li>Model and alpha were chosen on the same holdout used for reporting.</li><li>The best alpha is the smallest tested.</li><li>December market index and quote signal are filled with development medians.</li><li>The saved artifact is a pickle that needs <code>src/</code> importable (it contains the cleaning-statistics class), and was built with scikit-learn 1.6.1. Load it only from a trusted source. This dashboard never loads it.</li><li>Tests check that outputs exist and have the right shape; they do not check prediction accuracy.</li><li>The assessment outputs contain no uncertainty intervals (the production API adds separate, empirical ones; see Production ML).</li></ul>`)+
`<h2>Technical details</h2><details><summary>Model</summary><div><pre>${esc(JSON.stringify(T.meta,null,2))}</pre></div></details><details><summary>Project structure</summary><div><pre>${esc(Object.entries(T.tree).map(([d,f])=>d+'/\n'+f.map(x=>'  '+x).join('\n')).join('\n'))}</pre></div></details><details><summary>Dependencies</summary><div class=chips>${T.reqs.map(r=>`<span>${esc(r)}</span>`).join('')}</div></details><details><summary>Reproducibility commands</summary><div><pre>${esc(T.cmds.join('\n'))}</pre></div></details>`}};
const titles={overview:'Overview',data:'Data and quality',features:'Features',models:'Model lab',validation:'Validation',predictions:'Predictions',december:'December scenario',errors:'Error analysis',eda:'EDA gallery',submission:'Submission',production:'Production ML'};
$('#nav').innerHTML=`<b>Freight rate prediction<small>ML pipeline report</small></b>`+Object.entries(titles).map(([k,t])=>`<a href="#${k}" data-k=${k}>${t}</a>`).join('');
function after(k){if(k==='predictions'&&D.pred.rows.length){const R=D.pred.rows,q=$('#q');let cur=R[0];const show=r=>{cur=r;const rpm=r[7]/r[4],nw=newc.cities.includes(r[1])||newc.cities.includes(r[2]);$('#sel').innerHTML=card('',`<p class=sub>Estimated freight rate · ${esc(r[0])} · ${esc(r[6])}</p><div class=big>${usd(r[7])}</div>${nw?badge('Includes a city not seen in training','warn'):''}<div class=grid><div><small class=sub>Route</small><br><b>${esc(r[1])} to ${esc(r[2])}</b></div><div><small class=sub>Distance</small><br><b>${f0(r[4])} mi</b></div><div><small class=sub>Equipment</small><br><b>${esc(r[3])}</b></div><div><small class=sub>Weight</small><br><b>${r[5]==null?'Not provided':f0(r[5])+' lb'}</b></div><div><small class=sub>Predicted rate / mile</small><br><b>${usd(rpm)}</b></div></div><p class=sub>A single point estimate; the assessment output contains no uncertainty range (the production API provides an empirical interval). For scale, holdout MAE was ${usd(K.mae)}.</p>`)},list=()=>{const t=q.value.trim().toLowerCase(),m=(t?R.filter(r=>(r[0]+' '+r[1]+' '+r[2]).toLowerCase().includes(t)):R).slice(0,8);$('#res').innerHTML=m.length?m.map((r,i)=>`<button class="b pick" data-i="${R.indexOf(r)}">${esc(r[0])} · ${esc(r[1])} to ${esc(r[2])} · ${esc(r[3])} · ${usd(r[7])}</button>`).join(''):empty('No load matches that search.')};q.oninput=list;$('#res').onclick=e=>{const b=e.target.closest('button');if(b)show(R[b.dataset.i])};list();show(cur)}
if(k==='eda'){let c=D.eda[0].cat,s=0;const draw=()=>{const L=D.eda.filter(e=>e.cat===c),e=L[s]||L[0];$('#ch').innerHTML=L.map((x,i)=>`<button class=b data-s=${i} aria-pressed=${x===e}>${esc(x.title)}</button>`).join('');$('#view').innerHTML=card(esc(e.title),(e.img?`<img class=eda src="${e.img}" alt="${esc(e.title)}" loading=lazy>`:empty('This chart file is missing.'))+`<p><b>What this shows.</b> ${esc(e.what)}</p><p><b>Key takeaway.</b> ${esc(e.take)}</p>`)};$('#cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;c=b.dataset.c;s=0;document.querySelectorAll('#cats button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};$('#ch').onclick=e=>{const b=e.target.closest('button');if(b){s=+b.dataset.s;draw()}};draw()}}
function route(){const k=pages[location.hash.slice(1)]?location.hash.slice(1):'overview';try{$('#main').innerHTML=pages[k]();after(k)}catch(e){$('#main').innerHTML=`<div class=note>This page could not be drawn: ${esc(e.message)}</div>`}document.querySelectorAll('nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.k===k)||0);document.querySelectorAll('nav a').forEach(a=>a.dataset.k===k?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));document.title=titles[k]+' · Freight rate prediction';scrollTo(0,0)}
