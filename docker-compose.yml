# Local development only. No databases or queues are needed.
#   docker compose up --build      then open http://localhost:8000/docs
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: freight-rate-api:local
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PREDICTION_LOGGING: ${PREDICTION_LOGGING:-true}
      LOG_INPUT_FEATURES: ${LOG_INPUT_FEATURES:-true}
      PRODUCTION_MODEL_VERSION: ${PRODUCTION_MODEL_VERSION:-}
    volumes:
      # read-only registry: promote/rollback on the host, then `docker compose restart api`
      - ./models:/app/models:ro
      # prediction log persists on the host
      - ./monitoring:/app/monitoring
    restart: unless-stopped
